<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClearSky Flight Monitor</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>

<header>✈️ ClearSky Flight Monitor</header>

<div class="tabs">
  <div class="tab active" onclick="setAirport('NBO', this)">Nairobi</div>
  <div class="tab" onclick="setAirport('DXB', this)">Dubai</div>
  <div class="tab" onclick="setAirport('DOH', this)">Doha</div>
  <div class="tab" onclick="setAirport('AUH', this)">Abu Dhabi</div>
  <div class="tab" onclick="setAirport('IST', this)">Istanbul</div>
  <div class="tab" onclick="setAirport('FRA', this)">Frankfurt</div>
</div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search flight route or flight number">
</div>

<div id="result">Loading flights...</div>

<script src="app.js"></script>

</body>
</html>
