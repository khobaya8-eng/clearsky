<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClearSky</title>

<style>
body {
  font-family: Arial;
  background: #e6f4ff;
  margin: 0;
  padding: 0;
}

header {
  background: #87ceeb;
  padding: 20px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
}

.tabs {
  display: flex;
  justify-content: center;
  margin: 15px;
}

.tab {
  padding: 10px 20px;
  margin: 5px;
  background: #5dade2;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

.tab.active {
  background: #2e86c1;
}

.search-box {
  text-align: center;
  margin: 20px;
}

input {
  padding: 10px;
  width: 250px;
}

button {
  padding: 10px;
  margin-left: 5px;
  cursor: pointer;
}

#result {
  background: white;
  margin: 20px;
  padding: 20px;
  border-radius: 10px;
  min-height: 200px;
}

#advisory {
  background: #fff3cd;
  margin: 20px;
  padding: 15px;
  border-radius: 10px;
}

textarea {
  width: 100%;
  height: 80px;
}

</style>
</head>

<body>

<header>☁️ ClearSky</header>

<div class="tabs">
  <div class="tab active" onclick="setAirport('NBO')">Nairobi</div>
  <div class="tab" onclick="setAirport('DXB')">Dubai</div>
  <div class="tab" onclick="setAirport('DOH')">Doha</div>
  <div class="tab" onclick="setAirport('AUH')">Abu Dhabi</div>
</div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search NBO, DXB, DOH, AUH or flight">
  <button onclick="searchFlights()">Search</button>
  <button onclick="loadFlights()">Refresh Flights</button>
</div>

<div id="result">Loading flights...</div>

<div id="advisory">
  <h3>Travel Advisory (GCC Region)</h3>
  <textarea id="advisoryInput" placeholder="Enter travel advisory updates..."></textarea>
  <button onclick="saveAdvisory()">Save Advisory</button>
  <p id="savedAdvisory"></p>
</div>

<script src="app.js"></script>

</body>
</html>
