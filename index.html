<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearSky Flight Monitor</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    h1 { text-align: center; }
    .tabs { display: flex; justify-content: center; margin-bottom: 20px; }
    .tab { padding: 10px 20px; background: #007bff; color: #fff; margin: 0 5px; cursor: pointer; border-radius: 5px; }
    .tab.active { background: #0056b3; }
    #searchContainer { text-align: center; margin-bottom: 20px; }
    #searchInput { padding: 8px; width: 250px; }
    button { padding: 8px 12px; margin-left: 5px; cursor: pointer; }
    #result { background: #fff; padding: 20px; border-radius: 5px; min-height: 200px; }
  </style>
</head>
<body>

<h1>ClearSky Flight Monitor</h1>

<!-- Tabs -->
<div class="tabs">
  <div class="tab active" onclick="setAirport('NBO')">Nairobi (JKIA)</div>
  <div class="tab" onclick="setAirport('DXB')">Dubai (DXB)</div>
  <div class="tab" onclick="setAirport('DOH')">Doha (DOH)</div>
</div>

<!-- Search -->
<div id="searchContainer">
  <input type="text" id="searchInput" placeholder="Enter flight number or country">
  <button onclick="searchFlights()">Search</button>
  <button onclick="loadFlights()">Show All Flights</button>
</div>

<!-- Results -->
<div id="result"></div>

<script src="app.js"></script>
</body>
</html>
