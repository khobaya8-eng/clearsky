<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClearSky Flight Monitor</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>

<header>☁️ ClearSky</header>

<div class="tabs">
  <div class="tab active" onclick="setAirport('NBO', this)">Nairobi</div>
  <div class="tab" onclick="setAirport('DXB', this)">Dubai</div>
  <div class="tab" onclick="setAirport('DOH', this)">Doha</div>
  <div class="tab" onclick="setAirport('AUH', this)">Abu Dhabi</div>
</div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search flight or airport (NBO, DXB, DOH, AUH)">
  <button onclick="searchFlights()">Search</button>
  <button onclick="loadFlights()">Refresh</button>
</div>

<div id="result">Loading flights...</div>

<div id="map"></div>

<div id="advisory">
  <h3>Travel Advisory (GCC)</h3>
  <p id="savedAdvisory">Loading advisories...</p>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
