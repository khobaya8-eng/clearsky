<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClearSky Flight Monitor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Roboto', sans-serif;
  background: #0b1426;
  color: #e6f1ff;
  margin: 0;
}

header {
  background: #0a1a35;
  padding: 25px;
  text-align: center;
  font-size: 36px;
  font-family: 'Orbitron', sans-serif;
  color: #00ffcc;
}

.tabs {
  display: flex;
  justify-content: center;
  margin: 15px;
  flex-wrap: wrap;
}

.tab {
  padding: 12px 25px;
  margin: 5px;
  background: #1a2a4c;
  border-radius: 8px;
  cursor: pointer;
}

.tab.active {
  background: #003366;
}

.search-box {
  text-align: center;
  margin: 20px;
}

.search-box input {
  padding: 12px;
  width: 280px;
  border-radius: 8px;
  border: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 18px;
  margin: 20px;
}

.card {
  background: #0f203f;
  padding: 18px;
  border-radius: 14px;
  cursor: pointer;
  border-left: 6px solid #00ff88;
}

.details {
  max-height: 0;
  overflow: hidden;
  transition: 0.4s;
}

.details.show {
  max-height: 140px;
}

.status-green { border-left-color: #00ff88; }
.status-orange { border-left-color: orange; }
.status-red { border-left-color: red; }

#map {
  height: 450px;
  width: 90%;
  margin: 25px auto;
  border-radius: 14px;
}

footer {
  text-align:center;
  padding:15px;
  font-size:14px;
  color:#aaa;
  background:#0a1a35;
}
</style>
</head>

<body>

<header>✈️ ClearSky</header>

<div class="tabs">
  <div class="tab active" onclick="setAirport('NBO', this)">Nairobi</div>
  <div class="tab" onclick="setAirport('DXB', this)">Dubai</div>
  <div class="tab" onclick="setAirport('DOH', this)">Doha</div>
  <div class="tab" onclick="setAirport('AUH', this)">Abu Dhabi</div>
</div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search flight">
</div>

<div id="result">Loading flights...</div>

<h3 style="text-align:center;">🗺 Flight Map</h3>
<div id="map"></div>

<footer>© 2026 ClearSky. All rights reserved.</footer>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let selectedAirport = "NBO";
const aviationKey = "22874e1a15c5530668869c9c44b7f337";
let flights = [];

const airportNames = {
  NBO: "Nairobi (JKIA)",
  DXB: "Dubai International",
  DOH: "Doha Hamad",
  AUH: "Abu Dhabi International"
};

const airportCoords = {
  NBO: [1.2921, 36.8219],
  DXB: [25.2532, 55.3657],
  DOH: [25.2736, 51.6080],
  AUH: [24.4333, 54.6510]
};

let map = L.map('map').setView(airportCoords.NBO, 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// Switch airport
function setAirport(code, el) {
  selectedAirport = code;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  map.setView(airportCoords[code], 5);
  loadFlights();
}

// Countdown
function getCountdown(time) {
  let diff = new Date(time) - new Date();
  if (diff <= 0) return "Departed";

  let mins = Math.floor(diff / 60000);
  let hrs = Math.floor(mins / 60);

  return hrs > 0 ? `${hrs}h ${mins % 60}m` : `${mins}m`;
}

// Load flights
async function loadFlights() {
  const result = document.getElementById("result");
  result.innerHTML = "Loading...";
  flights = [];

  try {
    let res = await fetch(`https://api.aviationstack.com/v1/flights?access_key=${aviationKey}&dep_iata=${selectedAirport}`);
    let data = await res.json();

    flights = data.data.map(f => {
      let depRaw = f.departure?.estimated || f.departure?.scheduled;
      let arrRaw = f.arrival?.estimated || f.arrival?.scheduled;

      return {
        callsign: f.flight?.iata || "N/A",
        from: selectedAirport,
        to: f.arrival?.iata || "Unknown",

        status: f.flight_status?.toUpperCase() || "SCHEDULED",

        color:
          f.flight_status?.includes("cancel") ? "red" :
          f.flight_status?.includes("delay") ? "orange" : "green",

        depTime: depRaw ? new Date(depRaw).toLocaleTimeString([], {
          hour:'2-digit',
          minute:'2-digit',
          timeZone: f.departure.timezone || "UTC"
        }) : "N/A",

        arrTime: arrRaw ? new Date(arrRaw).toLocaleTimeString([], {
          hour:'2-digit',
          minute:'2-digit',
          timeZone: f.arrival.timezone || "UTC"
        }) : "N/A",

        date: depRaw ? new Date(depRaw).toLocaleDateString() : "N/A",

        countdown: depRaw ? getCountdown(depRaw) : "N/A",

        lat: airportCoords[selectedAirport][0],
        lon: airportCoords[selectedAirport][1]
      };
    });

  } catch {
    result.innerHTML = "❌ Error loading flights.";
    return;
  }

  displayFlights(flights);
}

// Display flights
function displayFlights(data) {
  const result = document.getElementById("result");

  if (!data.length) {
    result.innerHTML = "No flights available.";
    return;
  }

  result.innerHTML = `<h3>Flights from ${airportNames[selectedAirport]}</h3><div class="grid"></div>`;
  const grid = result.querySelector(".grid");

  map.eachLayer(l => { if (l instanceof L.Marker) map.removeLayer(l); });

  data.forEach((f, i) => {
    let card = document.createElement("div");
    card.className = `card status-${f.color}`;

    card.innerHTML = `
      <h4>✈ ${f.callsign}</h4>
      <p><b>Route:</b> ${airportNames[f.from]} → ${airportNames[f.to] || f.to}</p>
      <p><b>Status:</b> <span style="color:${f.color}">${f.status}</span></p>

      <div class="details" id="d-${i}">
        <p>📅 ${f.date}</p>
        <p>🕒 ${f.depTime} → ${f.arrTime}</p>
        <p>⏳ Departs in: ${f.countdown}</p>
      </div>
    `;

    card.onclick = () => {
      document.getElementById(`d-${i}`).classList.toggle("show");
    };

    grid.appendChild(card);

    L.marker([f.lat, f.lon]).addTo(map)
      .bindPopup(`${f.callsign}<br>${f.depTime} → ${f.arrTime}<br>${f.countdown}`);
  });
}

// Search
document.getElementById("searchInput").addEventListener("input", e => {
  let q = e.target.value.toUpperCase();
  displayFlights(flights.filter(f => f.callsign.includes(q) || f.to.includes(q)));
});

// Start
window.onload = loadFlights;
</script>

<footer style="text-align:center; padding:15px; font-size:14px; color:#aaa;">
  © 2026 ClearSky. All rights reserved. Unauthorised use or reproduction is prohibited.
</footer>

</body>
</html>
