<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearSky Flight Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>ClearSky Flight Monitor</h1>

  <!-- Search box -->
  <input type="text" id="searchInput" placeholder="Enter flight number or country">
  <button onclick="searchFlights()">Search</button>

  <!-- Show all live flights -->
  <button onclick="loadFlights()">Show All Live Flights</button>

  <!-- Results will appear here -->
  <div id="result"></div>

  <!-- Link to your JavaScript -->
  <script src="app.js"></script>

</body>
</html>
