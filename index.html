<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClearSky Flight Monitor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>☁️ ClearSky</header>

<div class="tabs">
  <div class="tab active" onclick="setAirport('NBO', this)">Nairobi</div>
  <div class="tab" onclick="setAirport('DXB', this)">Dubai</div>
  <div class="tab" onclick="setAirport('DOH', this)">Doha</div>
  <div class="tab" onclick="setAirport('AUH', this)">Abu Dhabi</div>
</div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search NBO, DXB, DOH, AUH or flight">
  <button onclick="searchFlights()">Search</button>
  <button onclick="loadFlights()">Refresh</button>
</div>

<div id="result">Loading flights...</div>

<div id="advisory">
  <h3>Travel Advisory (GCC)</h3>
  <select id="riskLevel">
    <option value="Safe">🟢 Safe</option>
    <option value="Warning">🟡 Warning</option>
    <option value="High Risk">🔴 High Risk</option>
  </select>
  <textarea id="advisoryInput" placeholder="Enter travel advisory..."></textarea>
  <button onclick="saveAdvisory()">Save</button>
  <p id="savedAdvisory"></p>
</div>

<script src="app.js"></script>
</body>
</html>
