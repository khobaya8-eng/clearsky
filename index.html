<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClearSky Flight Monitor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Roboto', sans-serif;
  background: #0b1426;
  color: #e6f1ff;
  margin: 0;
}
header {
  background: #0a1a35;
  padding: 25px;
  text-align: center;
  font-size: 36px;
  font-weight: 700;
  font-family: 'Orbitron', sans-serif;
  letter-spacing: 1px;
  color: #00ffcc;
  text-shadow: 0 2px 5px rgba(0,0,0,0.5);
}
.tabs { display: flex; justify-content: center; margin: 15px; flex-wrap: wrap; }
.tab {
  padding: 12px 25px;
  margin: 5px;
  background: #1a2a4c;
  color: #e6f1ff;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 500;
}
.tab:hover { background: #0f1b35; }
.tab.active { background: #003366; color: #fff; box-shadow: 0 0 12px rgba(0,102,204,0.6); }
.search-box { text-align: center; margin: 20px; }
.search-box input { padding: 12px 15px; width: 280px; border-radius: 8px; border: none; font-size: 16px; }
.advisory-box { background: #0a1a35; padding: 15px 25px; margin: 10px auto; width: 90%; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.4); }
.advisory-box h4 { margin-top:0; color: #00ffcc; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin: 20px; }
.card {
  background: #0f203f;
  padding: 18px;
  border-radius: 14px;
  cursor: pointer;
  transition: transform 0.3s, box-shadow 0.3s;
  border-left: 6px solid #00ff88;
}
.card:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(0,255,204,0.5); }
.card h4 { margin: 0 0 8px 0; font-family: 'Orbitron', sans-serif; font-weight: 500; }
.details { max-height: 0; overflow: hidden; transition: 0.4s; color: #bcdcff; margin-top: 8px; }
.details.show { max-height: 200px; }
.status-green { border-left-color: #00ff88; }
.status-orange { border-left-color: #ffbb33; }
.status-red { border-left-color: #ff4444; }
#map { height: 450px; width: 90%; margin: 25px auto; border-radius: 14px; border: 2px solid #003366; box-shadow: 0 0 15px rgba(0,102,204,0.5); }
.chat-box { text-align: center; margin: 25px 0; }
.chat-box a {
  background: #003366;
  color: #00ffcc;
  padding: 14px 25px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: 500;
  transition: 0.3s;
}
.chat-box a:hover { background: #0055aa; box-shadow: 0 0 12px rgba(0,102,204,0.6); }
</style>
</head>
<body>

<header>✈️ ClearSky</header>

<div class="tabs">
  <div class="tab active" onclick="setAirport('NBO', this)">Nairobi</div>
  <div class="tab" onclick="setAirport('DXB', this)">Dubai</div>
  <div class="tab" onclick="setAirport('DOH', this)">Doha</div>
  <div class="tab" onclick="setAirport('AUH', this)">Abu Dhabi</div>
</div>

<div class="advisory-box">
  <h4>🛂 GCC Travel Advisories</h4>
  <div class="advisories" id="advisories">
    <p style="color:red">Saudi Arabia: Flight delays expected</p>
    <p style="color:orange">UAE: Increased security checks</p>
    <p style="color:green">Qatar: Normal operations</p>
  </div>
</div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search flight number or destination">
</div>

<div id="result">Loading flights...</div>
<h3 style="text-align:center;">🗺 Flight Map</h3>
<div id="map"></div>

<div class="chat-box">
  <a href="https://wa.me/254702858487" target="_blank">💬 Chat with ClearSky Support</a>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
let selectedAirport = "NBO";
const aviationKey = "22874e1a15c5530668869c9c44b7f337"; // AviationStack Free API
const backendURL = "https://your-backend-url.com"; // Replace with your hosted scraper backend
let flights = [];

const airportNames = { NBO:"Nairobi (JKIA)", DXB:"Dubai International", DOH:"Doha Hamad", AUH:"Abu Dhabi International" };
const airportCoords = { NBO:[1.2921,36.8219], DXB:[25.2532,55.3657], DOH:[25.2736,51.6080], AUH:[24.4333,54.6510] };

let map = L.map('map').setView(airportCoords[selectedAirport], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(map);

function setAirport(code, el){
  selectedAirport = code;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  map.setView(airportCoords[code], 5);
  loadFlights();
}

function getCountdown(depTime){
  const diff = new Date(depTime) - new Date();
  if(diff<=0) return "Departed";
  const hrs = Math.floor(diff/3600000);
  const mins = Math.floor((diff%3600000)/60000);
  return `${hrs}h ${mins}m`;
}

async function loadFlights(){
  const result = document.getElementById("result");
  result.innerHTML = "Loading flight board...";
  flights = [];

  try{
    // 1️⃣ Scraper for published times
    const scrapeRes = await fetch(`${backendURL}/flights/${selectedAirport}`);
    const scrapeData = await scrapeRes.json();

    // 2️⃣ AviationStack status
    const aviRes = await fetch(`https://api.aviationstack.com/v1/flights?access_key=${aviationKey}&dep_iata=${selectedAirport}`);
    const aviData = await aviRes.json();

    flights = scrapeData.flights.map(f=>{
      const aviFlight = aviData.data.find(a=>a.flight?.iata===f.callsign);
      const status = aviFlight?.flight_status?.toUpperCase() || "SCHEDULED";
      const color = status.toLowerCase().includes("cancel")?"red":
                    status.toLowerCase().includes("delay")?"orange":"green";

      const countdown = f.depTime ? getCountdown(f.depTime) : "N/A";

      return {...f, status, color, countdown, from:selectedAirport, lat:airportCoords[selectedAirport][0], lon:airportCoords[selectedAirport][1]};
    });

  }catch(err){
    console.error(err);
    result.innerHTML = "❌ Error loading flights.";
    return;
  }

  displayFlights(flights);
}

function displayFlights(data){
  const result = document.getElementById("result");
  if(!data||data.length===0){ result.innerHTML="⚠️ No flights available."; return; }
  result.innerHTML=`<h3>🛫 Flights from ${airportNames[selectedAirport]}</h3><div class="grid"></div>`;
  const grid = result.querySelector(".grid");
  map.eachLayer(layer=>{if(layer instanceof L.Marker) map.removeLayer(layer);});

  data.forEach((f,index)=>{
    let card = document.createElement("div");
    card.className=`card status-${f.color}`;
    card.innerHTML=`
      <h4>✈ ${f.callsign}</h4>
      <p><b>Route:</b> ${airportNames[f.from]} → ${f.to}</p>
      <p><b>Status:</b> <span style="color:${f.color}; font-weight:bold;">${f.status}</span></p>
      <div class="details" id="details-${index}">
        <p>📅 ${f.depTime ? new Date(f.depTime).toLocaleDateString() : "N/A"}</p>
        <p>🕒 ${f.depTime} → ${f.arrTime}</p>
        <p>⏳ Departs in: ${f.countdown}</p>
      </div>
    `;
    card.onclick=()=>document.getElementById(`details-${index}`).classList.toggle("show");
    grid.appendChild(card);
    L.marker([f.lat,f.lon]).addTo(map)
      .bindPopup(`✈ ${f.callsign}<br>${airportNames[f.from]} → ${f.to}<br>${f.depTime} → ${f.arrTime}<br>⏳ ${f.countdown}`);
  });
}

document.getElementById("searchInput").addEventListener("input",function(){
  let query=this.value.trim().toUpperCase();
  if(!query) return displayFlights(flights);
  let filtered = flights.filter(f=> f.callsign.includes(query) || f.to.toUpperCase().includes(query));
  displayFlights(filtered);
});

window.onload=loadFlights;
</script>

<footer style="text-align:center; padding:15px; font-size:14px; color:#aaa;">
  © 2026 ClearSky. All rights reserved.
</footer>

</body>
</html>
