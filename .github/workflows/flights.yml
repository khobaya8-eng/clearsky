name: Update Flights Data

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (SAFE)
  workflow_dispatch:

jobs:
  fetch-flights:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch flight data safely
        run: |
          response=$(curl -s "http://api.aviationstack.com/v1/flights?access_key=22874e1a15c5530668869c9c44b7f337&dep_iata=NBO")

          # Prevent overwriting with error
          if echo "$response" | grep -q '"error"'; then
            echo "API limit reached. Skipping update."
          else
            echo "$response" > data/flights.json
          fi

      - name: Commit updated data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/flights.json
          git commit -m "Update flights data" || echo "No changes"
          git push
